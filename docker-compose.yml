services:
  postgres:
    image: postgres:17-alpine
    container_name: etl-marco2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: acidentes
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - etl_marco2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d acidentes"]
      interval: 5s
      timeout: 5s
      retries: 20

  metabase:
    image: metabase/metabase:v0.65.2.x
    container_name: etl-marco2-metabase
    hostname: metabase
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: America/Sao_Paulo
    volumes:
      - metabase_data:/metabase-data
      - /dev/urandom:/dev/random:ro
    networks:
      - postgres_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:3000/api/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  etl_marco2_pgdata:
  metabase_data:

networks:
  postgres_network:
    name: python_default
    external: true
